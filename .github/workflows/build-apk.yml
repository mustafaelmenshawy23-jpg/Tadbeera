name: Build Tedbeera Android APK

on:
  pull_request:
    branches: [main, recovery/feature-complete-baseline]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [main, recovery/feature-complete-baseline]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: TypeScript Validation
        run: npm run lint

      - name: Automated Unit Tests
        run: npm test

      - name: Build Web Assets
        run: npm run build

      - name: Verify corrected recipe photos are bundled
        run: |
          for image in chicken-pasta-white-sauce.jpg mashed-potato-eggs.jpg baked-eggs-vegetables.webp feteer-meshaltet.webp molokhia-egyptian.jpg basbousa-egyptian.jpg taameya-egyptian.webp mahshi-mixed-egyptian.webp bessara-egyptian.jpg om-ali-egyptian.jpg; do
            image_path="dist/images/recipes/$image"
            if [ ! -s "$image_path" ]; then
              echo "::error file=$image_path::Required offline recipe photograph is missing or empty."
              exit 1
            fi
            mime_type="$(file --mime-type -b "$image_path")"
            case "$image:$mime_type" in
              *.webp:image/webp|*.jpg:image/jpeg) ;;
              *) echo "::error file=$image_path::Unexpected image MIME type: $mime_type"; exit 1 ;;
            esac
            echo "Verified bundled original recipe photo: $image_path ($(stat -c%s "$image_path") bytes)"
          done

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          if [ -d "public/assets/aistudio" ]; then
            mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
            cp public/assets/aistudio/launchericon-48x48_08576b00.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-48x48_08576b00.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-72x72_e4abd8ef.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-72x72_e4abd8ef.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-96x96_4d503cd4.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-96x96_4d503cd4.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-144x144_b3711091.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-144x144_b3711091.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-192x192_a1111b2e.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
            cp public/assets/aistudio/launchericon-192x192_a1111b2e.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png 2>/dev/null || true
          fi

      - name: Verify Capacitor Local Notifications Plugin Registration
        run: |
          PLUGIN_FILE="android/app/src/main/assets/capacitor.plugins.json"
          if [ ! -f "$PLUGIN_FILE" ] || ! grep -q "LocalNotificationsPlugin" "$PLUGIN_FILE"; then
            echo "::error file=$PLUGIN_FILE::Capacitor Local Notifications plugin was not registered after cap sync."
            cat "$PLUGIN_FILE" 2>/dev/null || true
            exit 1
          fi
          echo "Local Notifications plugin registration verified."

      - name: Verify Native Permission and Reminder Plugins
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/tedbeera/egypt/MainActivity.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APP_GRADLE="android/app/build.gradle.kts"
          for plugin in MicrophonePermission NotificationPermission MealReminderScheduler; do
            if ! grep -q "registerPlugin(${plugin}Plugin::class.java)" "$MAIN_ACTIVITY"; then
              echo "::error file=$MAIN_ACTIVITY::Missing native registration for ${plugin}Plugin"
              exit 1
            fi
          done
          for permission in android.permission.POST_NOTIFICATIONS android.permission.RECORD_AUDIO android.permission.SCHEDULE_EXACT_ALARM; do
            if ! grep -q "$permission" "$MANIFEST"; then
              echo "::error file=$MANIFEST::Missing required permission $permission"
              exit 1
            fi
          done
          if ! grep -Eq 'targetSdk[[:space:]]*=[[:space:]]*(3[3-9]|[4-9][0-9])' "$APP_GRADLE"; then
            echo "::error file=$APP_GRADLE::Android target SDK must be 33 or newer for runtime notification permission."
            exit 1
          fi
          test -f "android/app/src/main/java/com/tedbeera/egypt/NotificationPermissionPlugin.kt"
          test -f "android/app/src/main/java/com/tedbeera/egypt/MicrophonePermissionPlugin.kt"
          test -f "android/app/src/main/java/com/tedbeera/egypt/MealReminderSchedulerPlugin.kt"
          echo "Native permission and reminder plugin registration verified."

      - name: Accept Android SDK Licenses & Prepare Gradle
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.14.3

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK Generated and Non-Empty
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error file=$APK_FILE::Build failed: APK output file does not exist at $APK_FILE!"
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE" 2>/dev/null || wc -c < "$APK_FILE")
          if [ "$FILE_SIZE" -le 1024 ]; then
            echo "::error file=$APK_FILE::Build failed: APK file is empty or corrupted (size: ${FILE_SIZE} bytes)!"
            exit 1
          fi
          echo "✅ APK successfully verified at $APK_FILE (${FILE_SIZE} bytes)"
          ls -lh "$APK_FILE"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tedbeera-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
