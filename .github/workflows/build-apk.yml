name: Build Tedbeera Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --save @capacitor/core @capacitor/android --legacy-peer-deps
          npm install --save-dev @capacitor/cli --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Setup Clean Android Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Accept Android SDK Licenses & Update Wrapper
        run: |
          yes | sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Tedbeera-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
