name: Tadbeera quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tadbeera-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: TypeScript, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

  android-native-validation:
    name: Android Kotlin compile (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify Local Notifications plugin registration
        run: |
          PLUGIN_FILE="android/app/src/main/assets/capacitor.plugins.json"
          if [ ! -f "$PLUGIN_FILE" ] || ! grep -q "LocalNotificationsPlugin" "$PLUGIN_FILE"; then
            echo "::error file=$PLUGIN_FILE::Local Notifications plugin was not registered after Capacitor sync."
            cat "$PLUGIN_FILE" 2>/dev/null || true
            exit 1
          fi

      - name: Verify native permission plugin registration
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/tedbeera/egypt/MainActivity.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          APP_GRADLE="android/app/build.gradle.kts"
          for plugin in MicrophonePermission NotificationPermission MealReminderScheduler; do
            grep -q "registerPlugin(${plugin}Plugin::class.java)" "$MAIN_ACTIVITY" || {
              echo "::error file=$MAIN_ACTIVITY::Missing native registration for ${plugin}Plugin"
              exit 1
            }
          done
          for permission in android.permission.POST_NOTIFICATIONS android.permission.RECORD_AUDIO android.permission.SCHEDULE_EXACT_ALARM; do
            grep -q "$permission" "$MANIFEST" || {
              echo "::error file=$MANIFEST::Missing required permission $permission"
              exit 1
            }
          done
          grep -Eq 'targetSdk[[:space:]]*=[[:space:]]*(3[3-9]|[4-9][0-9])' "$APP_GRADLE" || {
            echo "::error file=$APP_GRADLE::Android target SDK must be 33 or newer."
            exit 1
          }

      - name: Validate merged Android manifest and compile Kotlin (no APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:processDebugMainManifest :app:compileDebugKotlin --no-daemon

# APK packaging remains disabled for this pull request until native and device checks are complete.
