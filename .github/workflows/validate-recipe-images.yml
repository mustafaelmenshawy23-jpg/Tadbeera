name: Validate recipe photo sources

on:
  push:
    paths:
      - "src/data/seedData.ts"
      - "public/images/recipes/**"
      - ".github/workflows/validate-recipe-images.yml"
  pull_request:
    paths:
      - "src/data/seedData.ts"
      - "public/images/recipes/**"
      - ".github/workflows/validate-recipe-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-recipe-photo-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify recipe photo source records
        shell: bash
        run: |
          set -euo pipefail
          manifest="public/images/recipes/README.md"
          recipes="src/data/seedData.ts"
          test -s "$manifest"
          test -s "$recipes"
          # The source manifest and recipe catalog are checked for documented Commons mappings.
          manifest_rows=$(grep -c '^|' "$manifest")
          mapped_urls=$(grep -c 'commons.wikimedia.org/wiki/Special:FilePath/' "$recipes")
          if [[ "$manifest_rows" -lt 9 ]]; then
            echo "::error file=$manifest::Expected at least seven documented photo attribution rows"
            exit 1
          fi
          if [[ "$mapped_urls" -lt 7 ]]; then
            echo "::error file=$recipes::Expected at least seven Commons recipe image mappings"
            exit 1
          fi
          echo "Found $((manifest_rows - 2)) attribution rows and $mapped_urls Commons image mappings."
          echo "Note: these are remote photos; this check does not claim they are bundled for first-launch offline use."
