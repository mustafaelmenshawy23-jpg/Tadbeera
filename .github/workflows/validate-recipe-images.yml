name: Validate recipe photo sources

on:
  push:
    paths:
      - "src/data/seedData.ts"
      - "public/images/recipes/**"
      - "scripts/prepare-recipe-images.mjs"
      - ".github/workflows/validate-recipe-images.yml"
  pull_request:
    paths:
      - "src/data/seedData.ts"
      - "public/images/recipes/**"
      - "scripts/prepare-recipe-images.mjs"
      - ".github/workflows/validate-recipe-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-recipe-photo-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify recipe photo source records
        shell: bash
        run: |
          set -euo pipefail
          manifest="public/images/recipes/README.md"
          recipes="src/data/seedData.ts"
          test -s "$manifest"
          test -s "$recipes"
          grep -q "Chicken_Pasta_in_White_Sauce.jpg" "$manifest"
          grep -q "Mashed_potatoes,_eggs,_beans.jpg" "$manifest"
          grep -q "imageUrl: '/images/recipes/chicken-pasta-white-sauce.jpg'" "$recipes"
          grep -q "imageUrl: '/images/recipes/mashed-potato-eggs.jpg'" "$recipes"
          grep -q "prepare-recipe-images.mjs" "package.json"
          test -s "scripts/prepare-recipe-images.mjs"
          echo "Verified both corrected recipe image mappings and the offline build downloader."
