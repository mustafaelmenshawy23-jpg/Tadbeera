name: Validate offline recipe images

on:
  push:
    paths:
      - "public/images/recipes/**"
      - ".github/workflows/validate-recipe-images.yml"
  pull_request:
    paths:
      - "public/images/recipes/**"
      - ".github/workflows/validate-recipe-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-recipe-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify all 16 recipe image files exist
        shell: bash
        run: |
          set -euo pipefail
          dir="public/images/recipes"
          files=(
            "01-shakshuka.jpg"
            "02-koshari.jpg"
            "03-baked-pasta.jpg"
            "04-lentil-soup.jpg"
            "05-egyptian-fatta.jpg"
            "06-ful-medames.jpg"
            "07-potato-salad.jpg"
            "08-pasta-tomato.jpg"
            "09-mashed-potatoes-eggs.jpg"
            "10-omelet.jpg"
            "11-moussaka.jpg"
            "12-stuffed-pigeon.jpg"
            "13-mahshi.jpg"
            "14-kebda.jpg"
            "15-basbousa.jpg"
            "16-kunafa.jpg"
          )
          missing=0
          for file in "${files[@]}"; do
            if [[ ! -s "$dir/$file" ]]; then
              echo "::error file=$dir/$file::Missing or empty recipe image"
              missing=1
            else
              echo "Found: $file ($(stat -c%s "$dir/$file") bytes)"
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "Upload the missing files to $dir using the exact filenames listed in its README."
            exit 1
          fi
          echo "All 16 recipe image files are present."
